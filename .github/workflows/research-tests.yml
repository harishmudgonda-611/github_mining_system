name: Research normalizer tests

on:
  pull_request:
    paths:
      - "research/**"
      - "tests/test_research_normalize.py"
      - ".github/workflows/research-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "research/**"
      - "tests/test_research_normalize.py"

permissions:
  contents: read

jobs:
  research-normalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile research module and tests
        run: python -m compileall -q research tests
      - name: Run research normalizer tests
        run: python -m unittest discover -s tests -p "test_research_normalize.py" -v
